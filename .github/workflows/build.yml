name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "监控回放智能监控" main.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/监控回放智能监控.exe" "release/监控回放智能监控.exe"
          Copy-Item "README.md" "release/README.md"
          Compress-Archive -Path "release/*" -DestinationPath "监控回放智能监控-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 监控回放智能监控-Windows
          path: 监控回放智能监控-Windows.zip
